# Build the merged shadow_ctr out-of-tree module across a KMI matrix, then
# boot-test the TEST_KMI build under QEMU against three prebuilt kernels.
#
# shadow_ctr is a single combined shadow_ctr.ko built from subsystem sources
# under shadow_ctr/shadow_ctr/ (see shadow_ctr/README.md). This workflow
# builds that module, for every KMI in the matrix, inside SukiSU-Ultra's
# prebuilt "DDK" (Driver Development Kit) container image
# (ghcr.io/ylarod/ddk-min:<kmi>-<release>, see
# https://github.com/SukiSU-Ultra/SukiSU-Ultra/blob/main/.github/workflows/ddk-lkm.yml
# and .../build-lkm.yml for the KMI list). Each image ships a genuine
# vmlinux + Module.symvers + matching clang toolchain for that KMI (arm64
# only -- the real GKI device target), instead of a bare
# `git clone kernel/common` + `gki_defconfig` + `modules_prepare` tree, which
# only has stub/empty symbol CRC data and previously caused several
# hard-to-diagnose build failures:
#   - android12-5.10: arch/arm64/kernel/asm-offsets.c (via kvm_host.h ->
#     kgdb.h) failed to compile with every clang version available on a
#     plain Ubuntu runner ("value out of range for constraint 'I'"), because
#     no matching prebuilt toolchain was used.
#   - android15-6.6 / android16-6.12: modpost hard-errored on unresolved
#     core kernel symbols (no real Module.symvers), and android16-6.12's
#     gendwarfksyms needed libdw-dev, which wasn't installed.
# Building against the DDK's real vmlinux/Module.symvers/toolchain avoids
# all of the above.
#
# Module built (per KMI):
#   shadow_ctr                -- merged module containing the shared
#                                shadow_hijack hook engine plus shadow_ns,
#                                shadow_sysvipc, shadow_mqueue and
#                                shadow_cgdevices.
# The resulting .ko for a given KMI is uploaded on its own
# (shadow_ctr-modules-<kmi>-arm64); it no longer bundles the userspace
# checker binary (see below).
#
# shadow_ctr_checker is a plain userspace diagnostic *binary*, not a kernel
# module: it performs real syscalls to observe whether isolation actually
# works, rather than reporting compile-time Kconfig facts, so it is not tied
# to any particular KMI/kernel build at all -- it is cross-compiled once for
# arm64 using a standard aarch64 gcc cross toolchain (no DDK image, no kernel
# headers) and uploaded as its own artifact (shadow_ctr_checker-arm64). The
# "build" (.ko) and "build-checker" jobs are fully independent of each other
# (neither `needs:` the other) since they share no build inputs or outputs;
# only the QEMU test assets job below (which needs both) recombines them.
#
# Boot test (QEMU)
# -----------------
# Once the TEST_KMI (android14-6.1) .ko build and the checker build finish,
# "build-test-assets" downloads both and assembles everything the QEMU boot
# test needs:
#   - a small "injected ramdisk" (initramfs) whose /init is a busybox-based
#     stage-1 script. Its only job is to mount image1.ext4 (attached as a
#     virtio-blk device) and busybox switch_root into it -- the standard,
#     kernel-supported way to hand off from a cpio-based initramfs to a real
#     block-device root (functionally the "pivot_root into it" step: it
#     moves /dev into the new root, chroots into it, and execs the given
#     stage-2 init there).
#   - image1.ext4: an ext4 filesystem built directly from the contents of
#     testsuite.zip's ramdisk.cpio (a full Android system-as-root userland
#     with toybox, a real bionic libc, and static docker/dockerd/containerd/
#     runc already installed under /system/bin, see testsuite.zip's
#     provenance), plus a stage-2 init script this workflow adds at its
#     root. `mke2fs -d <dir>` populates the whole filesystem (permissions,
#     symlinks included) in one step, so no loopback mount/root privileges
#     are needed on the runner to build it.
#   - image2.ext4: a second, much smaller ext4 filesystem carrying exactly
#     the payload the stage-2 script needs once it is running as the new
#     root: the freshly built shadow_ctr.ko, the shadow_ctr_checker binary,
#     and docker.io/arm64v8/alpine:latest exported (via `docker export` of a
#     created-but-never-started container, i.e. a flat filesystem tarball)
#     into a tarball. Keeping this payload on its own image (mounted on
#     /mnt only once the real root is live) keeps image1.ext4 a faithful,
#     unmodified copy of the published ramdisk contents (aside from the one
#     stage-2 script needed to drive the test).
# The stage-2 script (running as PID 1 of the real root) then: mounts
# image2.ext4 on /mnt, runs shadow_ctr_checker, insmods shadow_ctr.ko, runs
# shadow_ctr_checker again, starts a real dockerd in the background
# (capturing its output to a log file), `docker import`s the exported alpine
# tarball (an exported container filesystem needs `docker import`, not
# `docker load`, to become a taggable image again), `docker run
# --privileged --rm --network host -it`s it, and finally powers off via
# sysrq -- i.e. an actual dockerd running under the shadow_ctr-patched
# kernel, not just a checker binary observing raw syscalls.
#
# The boot step exercises all three kernels bundled in testsuite.zip
# sequentially in a *single* job (not a matrix), so QEMU is installed and
# the (sizeable) injected ramdisk / ext4 images are downloaded only once
# instead of once per kernel:
#   - "stock": a stock, unpatched Android GKI kernel (no SukiSU/SUSFS/
#     shadow_ctr patches at all), a baseline sanity check of the QEMU boot
#     environment itself.
#   - "sukisu": SukiSU/SUSFS-patched but without ctr_patches, to isolate
#     whether any test failure is caused by ctr_patches specifically.
#   - "sukisu-ctrpatches": SukiSU/SUSFS-patched *with* ctr_patches applied --
#     the actual configuration shadow_ctr.ko is built and meant to be
#     insmod'd against.
# Each boot produces its own QEMU console log, uploaded together as a
# single 3-file artifact.
#
# Credit: SukiSU-Ultra (https://github.com/SukiSU-Ultra/SukiSU-Ultra).

name: Build and test shadow_ctr module

permissions:
  contents: read

on:
  push:
    branches: [shadow_ctr]
  pull_request:
    branches: [shadow_ctr]
  workflow_dispatch:
    inputs:
      kmis:
        description: 'Comma-separated DDK KMIs to build against (blank = full matrix)'
        required: false
        type: string
        default: ''

env:
  # KMIs published by SukiSU-Ultra's ghcr.io/ylarod/ddk-min image at this
  # DDK_RELEASE (see .../build-lkm.yml's matrix).
  DEFAULT_KMIS: >-
    android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12
  DDK_RELEASE: '20260313'
  # KMI whose build is boot-tested under QEMU below.
  TEST_KMI: android14-6.1
  # testsuite.zip bundles the three QEMU test kernels (stock / sukisu /
  # sukisu+ctr_patches) and the injectable ramdisk.cpio (toybox + busybox +
  # bionic libc + static docker/dockerd/containerd/runc preinstalled under
  # /system/bin) in one archive.
  TESTSUITE_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.2.0/testsuite.zip
  TEST_CONTAINER_IMAGE: docker.io/arm64v8/alpine:latest
  # Sizes (MiB) of the two ext4 images assembled for the QEMU test.
  # image1.ext4 holds the full testsuite ramdisk contents (~330MB
  # uncompressed) plus some headroom for /tmp and dockerd's vfs storage
  # driver at runtime; image2.ext4 only carries shadow_ctr.ko,
  # shadow_ctr_checker and the exported alpine tarball.
  IMAGE1_SIZE_MB: '1536'
  IMAGE2_SIZE_MB: '128'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      test_kmi: ${{ steps.set-matrix.outputs.test_kmi }}
    steps:
      - name: Compute KMI matrix
        id: set-matrix
        run: |
          kmis="${{ github.event.inputs.kmis }}"
          if [ -z "$kmis" ]; then
            kmis="$DEFAULT_KMIS"
          fi
          json=$(python3 -c "
          import json, sys
          kmis = [k.strip() for k in sys.argv[1].split(',') if k.strip()]
          print(json.dumps(kmis))
          " "$kmis")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          # Expose TEST_KMI as a job output: the "env" context is not
          # available in job-level "if:" conditions, so downstream jobs
          # cannot reference env.TEST_KMI directly there.
          echo "test_kmi=$TEST_KMI" >> "$GITHUB_OUTPUT"

  # shadow_ctr_checker is a plain userspace diagnostic binary (see
  # shadow_ctr_checker/README.md): it has no kernel-module build dependency
  # at all (no DDK image, no KDIR, no Module.symvers), so it is built once
  # for arm64 with a standard cross toolchain, completely independent of the
  # per-KMI kernel-module "build" job below -- neither job needs/depends on
  # the other, and the .ko artifact produced by "build" no longer bundles
  # this checker binary at all.
  build-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build shadow_ctr_checker (arm64, static)
        run: |
          make -C shadow_ctr_checker \
            CC=aarch64-linux-gnu-gcc
          file shadow_ctr_checker/shadow_ctr_checker

      - name: Upload shadow_ctr_checker (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr_checker-arm64
          path: shadow_ctr_checker/shadow_ctr_checker

  build:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull DDK build image (${{ matrix.kmi }}-${{ env.DDK_RELEASE }})
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ env.DDK_RELEASE }}"

      - name: Build shadow_ctr.ko (arm64, via DDK container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e KMI="${{ matrix.kmi }}" \
            "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ env.DDK_RELEASE }}" \
            bash -euxo pipefail -c '
              KDIR="/opt/ddk/kdir/${KMI}"
              ROOT="/workspace/shadow_ctr"

              make -C "$KDIR" M="$ROOT" modules -j"$(nproc)"

              # collect the built .ko into a staging dir for upload.
              mkdir -p /workspace/modules-out
              cp "$ROOT/shadow_ctr.ko" /workspace/modules-out/

              echo "=== built modules ==="
              printf "%s\n" "$ROOT/shadow_ctr.ko"
              echo "=== staged modules ==="
              ls -la /workspace/modules-out
            '
          # The DDK container runs as root, so modules-out/ (created inside
          # the container via the bind mount) is root-owned on the host;
          # reopen it for the "runner" user before uploading.
          sudo chown -R "$(id -u):$(id -g)" modules-out

      # --- single artifact containing only shadow_ctr.ko for this KMI ---
      # (no longer bundles shadow_ctr_checker -- see build-checker above)
      - name: Upload shadow_ctr.ko for ${{ matrix.kmi }}
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-modules-${{ matrix.kmi }}-arm64
          path: modules-out/

  # Assemble everything the QEMU boot test needs: the injected (busybox)
  # ramdisk, the two ext4 images, and (verbatim, unmodified) the three test
  # kernels bundled in testsuite.zip. Independent of the full KMI matrix --
  # only needs the single TEST_KMI .ko plus the checker binary.
  build-test-assets:
    needs: [prepare, build, build-checker]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-checker.result == 'success' && contains(fromJson(needs.prepare.outputs.matrix), needs.prepare.outputs.test_kmi) }}
    runs-on: ubuntu-latest
    steps:
      - name: Install test-asset build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio e2fsprogs

      - name: Download shadow_ctr.ko (${{ env.TEST_KMI }})
        uses: actions/download-artifact@v8
        with:
          name: shadow_ctr-modules-${{ env.TEST_KMI }}-arm64
          path: payload/

      - name: Download shadow_ctr_checker (arm64)
        uses: actions/download-artifact@v8
        with:
          name: shadow_ctr_checker-arm64
          path: payload/
      - run: chmod +x payload/shadow_ctr_checker

      # --- 1. Fetch testsuite.zip: three kernels + ramdisk.cpio ---
      - name: Download and extract testsuite.zip
        run: |
          set -e
          curl -fL -o testsuite.zip "$TESTSUITE_URL"
          mkdir -p testsuite
          unzip -o testsuite.zip -d testsuite
          ls -la testsuite

      # --- 2. docker.io/arm64v8/alpine:latest -> exported tarball ---
      #
      # `docker export` (not `docker save`) is used deliberately: it dumps a
      # created container's flat filesystem as a plain tarball, independent
      # of any image-manifest/layer format, so the stage-2 script inside
      # QEMU can reconstitute it with a plain `docker import` even though it
      # never itself pulled the image from a registry.
      - name: Pull and export test container image (${{ env.TEST_CONTAINER_IMAGE }})
        run: |
          set -e
          docker pull --platform linux/arm64 "$TEST_CONTAINER_IMAGE"
          cid=$(docker create --platform linux/arm64 "$TEST_CONTAINER_IMAGE" true)
          docker export "$cid" -o alpine-export.tar
          docker rm "$cid"
          ls -la alpine-export.tar

      # --- 3. image1.ext4: full ramdisk.cpio contents + stage-2 init ---
      - name: Assemble image1.ext4 (ramdisk contents + stage-2 init script)
        run: |
          set -e
          mkdir -p ramdisk-root
          (cd ramdisk-root && cpio -idm < "$GITHUB_WORKSPACE/testsuite/ramdisk.cpio")

          # Stage-2 init script: runs as PID 1 once busybox switch_root (in
          # the injected ramdisk below) has handed control to this real
          # root. All ramdisk utilities are invoked with absolute paths:
          # bionic's dynamic linker needs /proc/self/exe (or a resolvable
          # argv[0]) to load shared objects, which only holds once /proc is
          # mounted and the path is absolute.
          cat > ramdisk-root/stage2_test_init.sh <<'EOF'
          #!/system/bin/sh
          set -x
          # Mount devtmpfs/proc/sysfs first and immediately re-point stdio
          # at /dev/kmsg instead of /dev/console: PID 1's original fds are
          # otherwise easy to lose track of once /dev is replaced, silently
          # dropping every echo/trace/command-output line for the rest of
          # the script even though it keeps executing. /dev/kmsg writes
          # become kernel printk records, which reliably reaches the QEMU
          # console log.
          /system/bin/mount -t devtmpfs devtmpfs /dev 2>/dev/null
          exec </dev/console >/dev/kmsg 2>&1
          /system/bin/mount -t proc proc /proc
          /system/bin/mount -t sysfs sysfs /sys
          export PATH=/system/bin
          /system/bin/mkdir -p /dev/pts
          /system/bin/mount -t devpts devpts /dev/pts
          /system/bin/mkdir -p /sys/fs/cgroup
          /system/bin/mount -t cgroup2 cgroup2 /sys/fs/cgroup || /system/bin/mount -t tmpfs cgroup /sys/fs/cgroup
          # runc's pivot_root() refuses to operate with the initramfs-
          # derived root as its old root ("invalid argument"); bind-
          # mounting / onto itself turns it into an ordinary mount entry
          # that pivot_root can pivot away from.
          /system/bin/mount -o bind / /
          # A proper tmpfs (with xattr support) at /tmp: shadow_ctr_checker's
          # overlay2 self-test mkdtemp()s its lower/upper/work dirs under
          # /tmp, and it also backs dockerd's own vfs storage driver.
          /system/bin/mkdir -p /tmp
          /system/bin/mount -t tmpfs tmpfs /tmp
          /system/bin/ifconfig lo up

          echo "=== SHADOW_CTR_QEMU_TEST: mount image2.ext4 -> /mnt ==="
          /system/bin/mkdir -p /mnt
          /system/bin/mount -t ext4 /dev/vdb /mnt
          echo "mount image2.ext4 -> $?"
          /system/bin/chmod 755 /mnt/shadow_ctr_checker

          echo "=== SHADOW_CTR_QEMU_TEST: shadow_ctr_checker (pre-insmod) ==="
          /mnt/shadow_ctr_checker
          echo "shadow_ctr_checker (pre-insmod) -> $?"

          echo "=== SHADOW_CTR_QEMU_TEST: inserting merged module ==="
          /system/bin/insmod /mnt/shadow_ctr.ko
          echo "insmod shadow_ctr.ko -> $?"
          /system/bin/dmesg

          echo "=== SHADOW_CTR_QEMU_TEST: shadow_ctr_checker (post-insmod) ==="
          /mnt/shadow_ctr_checker
          echo "shadow_ctr_checker (post-insmod) -> $?"

          echo "=== SHADOW_CTR_QEMU_TEST: configuring dockerd (vfs storage) ==="
          /system/bin/mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<'JSON'
          {
            "storage-driver": "vfs",
            "iptables": false,
            "bridge": "none"
          }
          JSON

          echo "=== SHADOW_CTR_QEMU_TEST: starting dockerd (daemon) ==="
          dockerd --config-file=/etc/docker/daemon.json > /dockerd.log 2>&1 &
          for i in $(/system/bin/seq 1 30); do
            [ -S /var/run/docker.sock ] && break
            /system/bin/sleep 1
          done

          # /mnt/alpine.tar is a `docker export` of a container's flat
          # filesystem, not a `docker save` image archive, so it must be
          # reconstituted with `docker import` (which tags a flat rootfs
          # tarball as an image), not `docker load` (which only understands
          # docker save's manifest+layers format). This tag must match
          # TEST_CONTAINER_IMAGE above; it can't be substituted via the
          # workflow's GitHub Actions expression syntax here because the enclosing
          # heredoc is quoted ('EOF') to avoid the shell expanding this
          # script's own $-variables at write time.
          echo "=== SHADOW_CTR_QEMU_TEST: docker import (alpine tarball) ==="
          docker import /mnt/alpine.tar docker.io/arm64v8/alpine:latest
          echo "docker import -> $?"

          echo "=== SHADOW_CTR_QEMU_TEST: docker run (test container sanity) ==="
          docker run --privileged --rm --network host -it docker.io/arm64v8/alpine:latest true < /dev/null
          echo "docker run -> $?"

          echo "=== SHADOW_CTR_QEMU_TEST: dockerd log ==="
          cat /dockerd.log

          echo "=== SHADOW_CTR_QEMU_TEST: DONE ==="
          echo o > /proc/sysrq-trigger
          while true; do :; done
          EOF
          chmod 755 ramdisk-root/stage2_test_init.sh

          # mke2fs -d populates the whole filesystem (perms/symlinks
          # included) from a plain directory in one step, so no loopback
          # mount / root privileges are needed to build image1.ext4.
          dd if=/dev/zero of=image1.ext4 bs=1M count="$IMAGE1_SIZE_MB"
          mkfs.ext4 -q -F -d ramdisk-root image1.ext4
          ls -la image1.ext4

      # --- 4. image2.ext4: shadow_ctr.ko + shadow_ctr_checker + alpine.tar ---
      - name: Assemble image2.ext4 (module + checker + alpine tarball)
        run: |
          set -e
          mkdir -p image2-root
          cp payload/shadow_ctr.ko image2-root/
          cp payload/shadow_ctr_checker image2-root/
          chmod 755 image2-root/shadow_ctr_checker
          cp alpine-export.tar image2-root/alpine.tar
          ls -la image2-root

          dd if=/dev/zero of=image2.ext4 bs=1M count="$IMAGE2_SIZE_MB"
          mkfs.ext4 -q -F -d image2-root image2.ext4
          ls -la image2.ext4

      # --- 5. injected ramdisk: busybox stage-1 init that mounts
      #        image1.ext4 (/dev/vda) and switch_root's into it ---
      - name: Build injected (busybox) ramdisk
        run: |
          set -e
          docker pull --platform linux/arm64 busybox:musl
          cid=$(docker create --platform linux/arm64 busybox:musl true)
          mkdir -p injected-ramdisk
          docker cp "$cid:/bin/busybox" injected-ramdisk/busybox
          docker rm "$cid"

          mkdir -p injected-ramdisk/dev injected-ramdisk/proc injected-ramdisk/sys injected-ramdisk/newroot
          chmod 755 injected-ramdisk/busybox

          cat > injected-ramdisk/init <<'EOF'
          #!/busybox sh
          /busybox mount -t devtmpfs devtmpfs /dev
          exec </dev/console >/dev/kmsg 2>&1
          /busybox echo "=== SHADOW_CTR_QEMU_TEST: stage1 (initramfs) ==="
          /busybox mount -t ext4 /dev/vda /newroot
          /busybox echo "mount image1.ext4 -> $?"
          exec /busybox switch_root /newroot /stage2_test_init.sh
          EOF
          chmod 755 injected-ramdisk/init

          (cd injected-ramdisk && find . | cpio -o -H newc > "$GITHUB_WORKSPACE/injected-ramdisk.cpio")
          ls -la injected-ramdisk.cpio

      # --- 6. bundle: injected ramdisk + three kernels + two ext4 images ---
      - name: Assemble QEMU asset bundle
        run: |
          mkdir -p qemu-assets
          cp injected-ramdisk.cpio qemu-assets/
          cp testsuite/kernel-stock-* qemu-assets/kernel-stock
          cp testsuite/kernel-sukisu-ctrpatches-* qemu-assets/kernel-sukisu-ctrpatches
          cp testsuite/kernel-sukisu-[0-9]* qemu-assets/kernel-sukisu
          cp image1.ext4 qemu-assets/
          cp image2.ext4 qemu-assets/
          ls -la qemu-assets

      - name: Upload injected ramdisk, kernels and ext4 images
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-qemu-assets
          path: qemu-assets/

  # Boot-test all three testsuite kernels under QEMU with the exact same
  # injected ramdisk + ext4 images, sequentially in a single job (no
  # matrix): this installs qemu-system-arm and downloads the (sizeable)
  # ramdisk/ext4 images only once instead of three times. Skipped (not
  # failed) if build-test-assets itself was skipped (e.g. a custom `kmis`
  # workflow_dispatch input excluded TEST_KMI from the build matrix).
  test:
    needs: [build-test-assets]
    if: ${{ !cancelled() && needs.build-test-assets.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Download injected ramdisk, kernels and ext4 images
        uses: actions/download-artifact@v8
        with:
          name: shadow_ctr-qemu-assets
          path: qemu-assets/

      # A generous per-kernel timeout: starting dockerd + docker import + a
      # real `docker run` takes noticeably longer than a plain
      # insmod+checker smoke test.
      - name: Boot all three kernels under QEMU
        run: |
          set +e
          mkdir -p qemu-logs
          for variant in stock sukisu sukisu-ctrpatches; do
            echo "=== booting kernel variant: $variant ==="
            timeout --signal=KILL 300 \
              qemu-system-aarch64 \
                -M virt -cpu max -m 2G -smp 2 -nographic -no-reboot \
                -kernel "qemu-assets/kernel-$variant" \
                -initrd qemu-assets/injected-ramdisk.cpio \
                -drive file=qemu-assets/image1.ext4,format=raw,if=virtio \
                -drive file=qemu-assets/image2.ext4,format=raw,if=virtio \
                -append "console=ttyAMA0 rdinit=/init earlycon panic=-1" \
              > "qemu-logs/qemu-console-$variant.log" 2>&1
            echo "QEMU ($variant) exited with status $?"
            tail -n 100 "qemu-logs/qemu-console-$variant.log"
          done
          ls -la qemu-logs

      - name: Upload QEMU console logs (stock / sukisu / sukisu-ctrpatches)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-qemu-logs
          path: qemu-logs/
