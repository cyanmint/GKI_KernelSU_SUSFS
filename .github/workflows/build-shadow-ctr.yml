# Build the merged shadow_ctr out-of-tree module across a KMI matrix, then
# boot-test the TEST_KMI build under QEMU against three prebuilt kernels.
#
# shadow_ctr is a single combined shadow_ctr.ko built from subsystem sources
# under shadow_ctr/shadow_ctr/ (see shadow_ctr/README.md). This workflow
# builds that module, for every KMI in the matrix, inside SukiSU-Ultra's
# prebuilt "DDK" (Driver Development Kit) container image
# (ghcr.io/ylarod/ddk-min:<kmi>-<release>, see
# https://github.com/SukiSU-Ultra/SukiSU-Ultra/blob/main/.github/workflows/ddk-lkm.yml
# and .../build-lkm.yml for the KMI list). Each image ships a genuine
# vmlinux + Module.symvers + matching clang toolchain for that KMI (arm64
# only -- the real GKI device target), instead of a bare
# `git clone kernel/common` + `gki_defconfig` + `modules_prepare` tree, which
# only has stub/empty symbol CRC data and previously caused several
# hard-to-diagnose build failures:
#   - android12-5.10: arch/arm64/kernel/asm-offsets.c (via kvm_host.h ->
#     kgdb.h) failed to compile with every clang version available on a
#     plain Ubuntu runner ("value out of range for constraint 'I'"), because
#     no matching prebuilt toolchain was used.
#   - android15-6.6 / android16-6.12: modpost hard-errored on unresolved
#     core kernel symbols (no real Module.symvers), and android16-6.12's
#     gendwarfksyms needed libdw-dev, which wasn't installed.
# Building against the DDK's real vmlinux/Module.symvers/toolchain avoids
# all of the above.
#
# Module built (per KMI):
#   shadow_ctr                -- merged module containing the shared
#                                shadow_hijack hook engine plus shadow_ns,
#                                shadow_sysvipc, shadow_mqueue and
#                                shadow_cgdevices.
# The resulting .ko for a given KMI is uploaded on its own
# (shadow_ctr-modules-<kmi>-arm64); it no longer bundles the userspace
# checker binary (see below).
#
# shadow_ctr_checker is a plain userspace diagnostic *binary*, not a kernel
# module: it performs real syscalls to observe whether isolation actually
# works, rather than reporting compile-time Kconfig facts, so it is not tied
# to any particular KMI/kernel build at all -- it is cross-compiled once for
# arm64 using a standard aarch64 gcc cross toolchain (no DDK image, no kernel
# headers) and uploaded as its own artifact (shadow_ctr_checker-arm64). The
# "build" (.ko) and "build-checker" jobs are fully independent of each other
# (neither `needs:` the other) since they share no build inputs or outputs;
# only the "test" job below (which needs both) recombines them.
#
# Boot test (QEMU)
# -----------------
# testsuite.zip now bundles a ready-to-use image1.ext4 directly (a full
# Android system-as-root userland with toybox, a real bionic libc, static
# docker/dockerd/containerd/runc under /system/bin, and the exported alpine
# tarball already baked in at its root), so this workflow no longer builds
# it at all -- it is downloaded and used completely verbatim.
#
# Once the TEST_KMI (android14-6.1) .ko build and the checker build finish,
# the "test" job downloads both, fetches testsuite.zip, and assembles the
# two remaining things the QEMU boot test needs before booting all three
# kernels in the same job:
#   - a small "injected ramdisk" (initramfs) whose /init is a busybox-based
#     stage-1 script (qemu_test/first_stage_init.sh). Its job is to mount
#     image1.ext4 as the new root and image2.ext4 at a directory inside it
#     (both attached as NVMe devices -- the test kernels have no virtio
#     support), then busybox switch_root into image1.ext4 and exec the
#     stage-2 init living on image2.ext4 -- the standard, kernel-supported
#     way to hand off from a cpio-based initramfs to a real block-device
#     root (functionally the "pivot_root into it" step: it moves /dev into
#     the new root, chroots into it, and execs the given stage-2 init
#     there).
#   - image2.ext4: a small ext4 filesystem carrying the freshly built
#     shadow_ctr.ko, the shadow_ctr_checker binary and the stage-2 init
#     script (qemu_test/second_stage_init.sh) -- everything the stage-2
#     script needs to insmod/exec once it is running as the new root.
#     Keeping this payload on its own image (mounted on /mnt inside
#     image1.ext4 by stage-1, before switch_root) keeps image1.ext4's
#     prebuilt contents untouched by the shadow_ctr build artifacts.
# The stage-2 script (running as PID 1 of the real root, itself read from
# image2.ext4 already mounted at /mnt) then: runs shadow_ctr_checker,
# insmods shadow_ctr.ko, runs shadow_ctr_checker again, starts a real
# dockerd in the background (capturing its output to a log file), `docker
# import`s the alpine tarball already sitting at the root of image1.ext4,
# `docker run --privileged --rm --network host -it`s it, and finally powers
# off via sysrq -- i.e. an actual dockerd running under the
# shadow_ctr-patched kernel, not just a checker binary observing raw
# syscalls.
#
# The boot step exercises all three kernels bundled in testsuite.zip
# sequentially in a *single* job (not a matrix), so QEMU is installed and
# the (sizeable) prebuilt image1.ext4 is downloaded only once instead of
# once per kernel:
#   - "stock": a stock, unpatched Android GKI kernel (no SukiSU/SUSFS/
#     shadow_ctr patches at all), a baseline sanity check of the QEMU boot
#     environment itself.
#   - "sukisu": SukiSU/SUSFS-patched but without ctr_patches, to isolate
#     whether any test failure is caused by ctr_patches specifically.
#   - "sukisu-ctrpatches": SukiSU/SUSFS-patched *with* ctr_patches applied --
#     the actual configuration shadow_ctr.ko is built and meant to be
#     insmod'd against.
# Each boot produces its own QEMU console log, uploaded together as a
# single 3-file artifact.
#
# Credit: SukiSU-Ultra (https://github.com/SukiSU-Ultra/SukiSU-Ultra).

name: Build and test shadow_ctr module

permissions:
  contents: read

on:
  push:
    branches: [shadow_ctr]
  pull_request:
    branches: [shadow_ctr]
  workflow_dispatch:
    inputs:
      kmis:
        description: 'Comma-separated DDK KMIs to build against (blank = full matrix)'
        required: false
        type: string
        default: ''

env:
  # KMIs published by SukiSU-Ultra's ghcr.io/ylarod/ddk-min image at this
  # DDK_RELEASE (see .../build-lkm.yml's matrix).
  DEFAULT_KMIS: >-
    android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12
  DDK_RELEASE: '20260313'
  # KMI whose build is boot-tested under QEMU below.
  TEST_KMI: android14-6.1
  # testsuite.zip bundles the three QEMU test kernels (stock / sukisu /
  # sukisu+ctr_patches) and a ready-to-use image1.ext4 (a full Android
  # system-as-root userland with toybox, bionic libc, static
  # docker/dockerd/containerd/runc preinstalled under /system/bin, and the
  # exported alpine tarball already baked in at its root) in one archive.
  TESTSUITE_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.2.0/testsuite.zip
  # Size (MiB) of image2.ext4, the only ext4 image this workflow still
  # assembles; it only carries shadow_ctr.ko, shadow_ctr_checker and
  # second_stage_init.sh.
  IMAGE2_SIZE_MB: '32'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      test_kmi: ${{ steps.set-matrix.outputs.test_kmi }}
    steps:
      - name: Compute KMI matrix
        id: set-matrix
        run: |
          kmis="${{ github.event.inputs.kmis }}"
          if [ -z "$kmis" ]; then
            kmis="$DEFAULT_KMIS"
          fi
          json=$(python3 -c "
          import json, sys
          kmis = [k.strip() for k in sys.argv[1].split(',') if k.strip()]
          print(json.dumps(kmis))
          " "$kmis")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          # Expose TEST_KMI as a job output: the "env" context is not
          # available in job-level "if:" conditions, so downstream jobs
          # cannot reference env.TEST_KMI directly there.
          echo "test_kmi=$TEST_KMI" >> "$GITHUB_OUTPUT"

  # shadow_ctr_checker is a plain userspace diagnostic binary (see
  # shadow_ctr_checker/README.md): it has no kernel-module build dependency
  # at all (no DDK image, no KDIR, no Module.symvers), so it is built once
  # for arm64 with a standard cross toolchain, completely independent of the
  # per-KMI kernel-module "build" job below -- neither job needs/depends on
  # the other, and the .ko artifact produced by "build" no longer bundles
  # this checker binary at all.
  build-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build shadow_ctr_checker (arm64, static)
        run: |
          make -C shadow_ctr_checker \
            CC=aarch64-linux-gnu-gcc
          file shadow_ctr_checker/shadow_ctr_checker

      - name: Upload shadow_ctr_checker (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr_checker-arm64
          path: shadow_ctr_checker/shadow_ctr_checker

  build:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull DDK build image (${{ matrix.kmi }}-${{ env.DDK_RELEASE }})
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ env.DDK_RELEASE }}"

      - name: Build shadow_ctr.ko (arm64, via DDK container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e KMI="${{ matrix.kmi }}" \
            "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ env.DDK_RELEASE }}" \
            bash -euxo pipefail -c '
              KDIR="/opt/ddk/kdir/${KMI}"
              ROOT="/workspace/shadow_ctr"

              make -C "$KDIR" M="$ROOT" modules -j"$(nproc)"

              # collect the built .ko into a staging dir for upload.
              mkdir -p /workspace/modules-out
              cp "$ROOT/shadow_ctr.ko" /workspace/modules-out/

              echo "=== built modules ==="
              printf "%s\n" "$ROOT/shadow_ctr.ko"
              echo "=== staged modules ==="
              ls -la /workspace/modules-out
            '
          # The DDK container runs as root, so modules-out/ (created inside
          # the container via the bind mount) is root-owned on the host;
          # reopen it for the "runner" user before uploading.
          sudo chown -R "$(id -u):$(id -g)" modules-out

      # --- single artifact containing only shadow_ctr.ko for this KMI ---
      # (no longer bundles shadow_ctr_checker -- see build-checker above)
      - name: Upload shadow_ctr.ko for ${{ matrix.kmi }}
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-modules-${{ matrix.kmi }}-arm64
          path: modules-out/

  # Build the injected (busybox) ramdisk and image2.ext4 (module + checker
  # + stage-2 init), then boot-test all three testsuite kernels under QEMU
  # against them plus the prebuilt image1.ext4 from testsuite.zip -- all in
  # one job, since assembling these lightweight assets no longer needs its
  # own separate session (no more building image1.ext4 or exporting an
  # alpine tarball). Independent of the full KMI matrix -- only needs the
  # single TEST_KMI .ko plus the checker binary. Skipped (not failed) if
  # TEST_KMI was excluded from the build matrix (e.g. via a custom `kmis`
  # workflow_dispatch input).
  test:
    needs: [prepare, build, build-checker]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-checker.result == 'success' && contains(fromJson(needs.prepare.outputs.matrix), needs.prepare.outputs.test_kmi) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio e2fsprogs qemu-system-arm

      - name: Download shadow_ctr.ko (${{ env.TEST_KMI }})
        uses: actions/download-artifact@v8
        with:
          name: shadow_ctr-modules-${{ env.TEST_KMI }}-arm64
          path: payload/

      - name: Download shadow_ctr_checker (arm64)
        uses: actions/download-artifact@v8
        with:
          name: shadow_ctr_checker-arm64
          path: payload/
      - run: chmod +x payload/shadow_ctr_checker

      # --- 1. Fetch testsuite.zip: three kernels + prebuilt image1.ext4 ---
      - name: Download and extract testsuite.zip
        run: |
          set -e
          curl -fL -o testsuite.zip "$TESTSUITE_URL"
          mkdir -p testsuite
          unzip -o testsuite.zip -d testsuite
          # Normalize the versioned kernel filenames to fixed names so the
          # boot loop below can reference them unambiguously (kernel-sukisu-*
          # would otherwise also glob-match kernel-sukisu-ctrpatches-*).
          cp testsuite/kernel-stock-* testsuite/kernel-stock
          cp testsuite/kernel-sukisu-ctrpatches-* testsuite/kernel-sukisu-ctrpatches
          cp testsuite/kernel-sukisu-[0-9]* testsuite/kernel-sukisu
          ls -la testsuite

      # --- 2. image2.ext4: shadow_ctr.ko + shadow_ctr_checker +
      #        second_stage_init.sh ---
      - name: Assemble image2.ext4 (module + checker + stage-2 init)
        run: |
          set -e
          mkdir -p image2-root
          cp payload/shadow_ctr.ko image2-root/
          cp payload/shadow_ctr_checker image2-root/
          chmod 755 image2-root/shadow_ctr_checker

          # Stage-2 init script: runs as PID 1 once busybox switch_root (in
          # the injected ramdisk below) has handed control to the real root
          # (image1.ext4), which mounts this image at /mnt beforehand.
          # Committed at qemu_test/second_stage_init.sh for better
          # management (rather than generated inline here).
          cp qemu_test/second_stage_init.sh image2-root/second_stage_init.sh
          chmod 755 image2-root/second_stage_init.sh
          ls -la image2-root

          dd if=/dev/zero of=image2.ext4 bs=1M count="$IMAGE2_SIZE_MB"
          mkfs.ext4 -q -F -d image2-root image2.ext4
          ls -la image2.ext4

      # --- 3. injected ramdisk: busybox stage-1 init that mounts
      #        image1.ext4 (/dev/nvme0n1) and switch_root's into it ---
      - name: Build injected (busybox) ramdisk
        run: |
          set -e
          docker pull --platform linux/arm64 busybox:musl
          cid=$(docker create --platform linux/arm64 busybox:musl true)
          mkdir -p injected-ramdisk
          docker cp "$cid:/bin/busybox" injected-ramdisk/busybox
          docker rm "$cid"

          mkdir -p injected-ramdisk/dev injected-ramdisk/proc injected-ramdisk/sys injected-ramdisk/newroot
          chmod 755 injected-ramdisk/busybox

          # Stage-1 init script: committed at qemu_test/first_stage_init.sh
          # for better management (rather than generated inline here).
          cp qemu_test/first_stage_init.sh injected-ramdisk/init
          chmod 755 injected-ramdisk/init

          (cd injected-ramdisk && find . | cpio -o -H newc > "$GITHUB_WORKSPACE/injected-ramdisk.cpio")
          ls -la injected-ramdisk.cpio

      # A generous per-kernel timeout: starting dockerd + docker import + a
      # real `docker run` takes noticeably longer than a plain
      # insmod+checker smoke test.
      - name: Boot all three kernels under QEMU
        run: |
          set +e
          mkdir -p qemu-logs
          for variant in stock sukisu sukisu-ctrpatches; do
            echo "=== booting kernel variant: $variant ==="
            timeout --signal=KILL 300 \
              qemu-system-aarch64 \
                -M virt -cpu max -m 2G -smp 2 -nographic -no-reboot \
                -kernel "testsuite/kernel-$variant" \
                -initrd injected-ramdisk.cpio \
                -drive file=testsuite/image1.ext4,if=none,id=image1,format=raw \
                -device nvme,serial=11451401,drive=image1 \
                -drive file=image2.ext4,if=none,id=image2,format=raw \
                -device nvme,serial=11451402,drive=image2 \
                -append "console=ttyAMA0 rdinit=/init earlycon panic=-1" \
              > "qemu-logs/qemu-console-$variant.log" 2>&1
            echo "QEMU ($variant) exited with status $?"
            tail -n 100 "qemu-logs/qemu-console-$variant.log"
          done
          ls -la qemu-logs

      - name: Upload QEMU console logs (stock / sukisu / sukisu-ctrpatches)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-qemu-logs
          path: qemu-logs/
