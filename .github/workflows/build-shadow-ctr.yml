# Kernel-version-matrix build for the shadow_ctr out-of-tree module family.
#
# shadow_ctr used to be a single combined shadow_ctr.ko; it is now split into
# several independently loadable modules under shadow_ctr/ (see
# shadow_ctr/README.md). This workflow builds every module, for every KMI in
# the matrix, inside SukiSU-Ultra's prebuilt "DDK" (Driver Development Kit)
# container image (ghcr.io/ylarod/ddk-min:<kmi>-<release>, see
# https://github.com/SukiSU-Ultra/SukiSU-Ultra/blob/main/.github/workflows/ddk-lkm.yml
# and .../build-lkm.yml for the KMI list). Each image ships a genuine
# vmlinux + Module.symvers + matching clang toolchain for that KMI (arm64
# only -- the real GKI device target), instead of a bare
# `git clone kernel/common` + `gki_defconfig` + `modules_prepare` tree, which
# only has stub/empty symbol CRC data and previously caused several
# hard-to-diagnose build failures:
#   - android12-5.10: arch/arm64/kernel/asm-offsets.c (via kvm_host.h ->
#     kgdb.h) failed to compile with every clang version available on a
#     plain Ubuntu runner ("value out of range for constraint 'I'"), because
#     no matching prebuilt toolchain was used.
#   - android15-6.6 / android16-6.12: modpost hard-errored on unresolved
#     core kernel symbols (no real Module.symvers), and android16-6.12's
#     gendwarfksyms needed libdw-dev, which wasn't installed.
# Building against the DDK's real vmlinux/Module.symvers/toolchain avoids
# all of the above, exactly as it did for the QEMU boot-test workflow.
#
# Modules built (per KMI, in this order):
#   shadow_hijack             -- shared ftrace/kprobe function-hijacking
#                                implementation; built FIRST because
#                                shadow_ns, shadow_sysvipc, shadow_mqueue and
#                                shadow_cgdevices all resolve its
#                                EXPORT_SYMBOL_GPL symbols at modpost time
#                                via KBUILD_EXTRA_SYMBOLS=<hijack>/Module.symvers.
#   shadow_ns                 -- single, standalone namespace system (no
#                                submodules); real UTS/PID/USER isolation plus
#                                IPC/NET bookkeeping fallback, only for
#                                whichever types this KMI's kernel build
#                                genuinely lacks. Depends only on
#                                shadow_hijack.
#   shadow_sysvipc, shadow_mqueue, shadow_cgdevices
#                             -- no inter-module deps, except they also depend
#                                on shadow_hijack for their hook implementation.
#   shadow_ctr_checker        -- pure standalone diagnostics module, no
#                                dependency on any other shadow_ctr module;
#                                built/loaded last purely so it can observe
#                                all of the other modules that happen to be
#                                loaded (not a hard requirement).
#   shadow_overlay2           -- vendored fs/overlayfs; ONLY built for
#                                android14-6.1 (its VFS ABI is incompatible
#                                with the other KMIs), mirroring the old
#                                WITH_SHADOW_OVERLAY gating. See
#                                shadow_ctr/shadow_overlay2/README.md.
# All resulting .ko files for a given KMI are uploaded together as a single
# artifact (shadow_ctr-modules-<kmi>-arm64), so consumers download one bundle
# per kernel version instead of stitching together per-module artifacts.
#
# Credit: SukiSU-Ultra (https://github.com/SukiSU-Ultra/SukiSU-Ultra).

name: Build shadow_ctr modules

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'shadow_ctr/**'
      - '.github/workflows/build-shadow-ctr.yml'
  pull_request:
    paths:
      - 'shadow_ctr/**'
      - '.github/workflows/build-shadow-ctr.yml'
  workflow_dispatch:
    inputs:
      kmis:
        description: 'Comma-separated DDK KMIs to build against (blank = full matrix)'
        required: false
        type: string
        default: ''

env:
  # KMIs published by SukiSU-Ultra's ghcr.io/ylarod/ddk-min image at this
  # DDK_RELEASE (see .../build-lkm.yml's matrix); kept in sync with the QEMU
  # test workflow's DDK_RELEASE.
  DEFAULT_KMIS: >-
    android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12
  DDK_RELEASE: '20260313'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute KMI matrix
        id: set-matrix
        run: |
          kmis="${{ github.event.inputs.kmis }}"
          if [ -z "$kmis" ]; then
            kmis="$DEFAULT_KMIS"
          fi
          json=$(python3 -c "
          import json, sys
          kmis = [k.strip() for k in sys.argv[1].split(',') if k.strip()]
          print(json.dumps(kmis))
          " "$kmis")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull DDK build image (${{ matrix.kmi }}-${{ env.DDK_RELEASE }})
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ env.DDK_RELEASE }}"

      - name: Build all shadow_ctr modules (arm64, via DDK container)
        run: |
          # shadow_overlay2 (vendored fs/overlayfs) is only source-compatible
          # with android14-6.1 -- see shadow_ctr/shadow_overlay2/README.md.
          if [ "${{ matrix.kmi }}" = "android14-6.1" ]; then
            build_overlay=1
          else
            build_overlay=0
          fi
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e BUILD_OVERLAY="$build_overlay" -e KMI="${{ matrix.kmi }}" \
            "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ env.DDK_RELEASE }}" \
            bash -euxo pipefail -c '
              KDIR="/opt/ddk/kdir/${KMI}"
              ROOT="/workspace/shadow_ctr"
              J="$(nproc)"

              build() { # <module-dir> [extra make args...]
                local dir="$1"; shift
                make -C "$KDIR" M="$ROOT/$dir" modules -j"$J" "$@"
              }

              # 0) shadow_hijack first -- shared hook implementation; produces
              #    the Module.symvers that every hooking module resolves via
              #    KBUILD_EXTRA_SYMBOLS.
              build shadow_hijack
              HIJACK_SYMS="$ROOT/shadow_hijack/Module.symvers"

              # 1) shadow_ns next -- single standalone namespace system;
              #    depends only on shadow_hijack.
              build shadow_ns KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"

              # 2) standalone modules (no inter-module deps, but they all
              #    depend on shadow_hijack for their hook implementation).
              build shadow_sysvipc KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"
              build shadow_mqueue KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"
              build shadow_cgdevices KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"
              # shadow_ctr_checker is a pure standalone diagnostics tool with
              # no dependency on any other shadow_ctr module.
              build shadow_ctr_checker

              # 3) overlay2 only on android14-6.1.
              if [ "$BUILD_OVERLAY" = "1" ]; then
                build shadow_overlay2
              fi

              # collect every built .ko into one staging dir so all modules
              # for this KMI can be uploaded together as a single artifact.
              mkdir -p /workspace/modules-out
              find "$ROOT" -name "*.ko" -exec cp {} /workspace/modules-out/ \;

              echo "=== built modules ==="
              find "$ROOT" -name "*.ko" -printf "%p\n" | sort
              echo "=== staged modules ==="
              ls -la /workspace/modules-out
            '

      # --- single artifact bundling every module built for this KMI --------
      - name: Upload all shadow_ctr modules for ${{ matrix.kmi }}
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-modules-${{ matrix.kmi }}-arm64
          path: modules-out/
