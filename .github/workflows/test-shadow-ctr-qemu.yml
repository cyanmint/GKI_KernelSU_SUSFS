# Boot-test the merged shadow_ctr.ko module under QEMU.
#
# shadow_ctr is again a single combined shadow_ctr.ko built from subsystem
# sources under shadow_ctr/shadow_ctr/ (see shadow_ctr/README.md). This
# workflow builds that android14-6.1 arm64 module, injects the freshly built
# .ko (plus the cross-compiled shadow_ctr_checker userspace binary) into a
# prebuilt test kernel + ramdisk image, boots it under qemu-system-aarch64,
# insmods only shadow_ctr.ko, runs shadow_ctr_checker directly, and collects
# the serial console log (including the insmod attempt, resulting kernel
# messages, and the checker's PASS/STUB/FAIL report) as a build artifact for
# inspection.
#
# The test ramdisk is a standalone (system-as-root) recovery image published
# at the v2.1.0 release specifically for this kind of smoke test; it ships
# busybox/toybox utilities and does not require any additional block
# devices, so it can boot directly from an initramfs under QEMU's "virt"
# machine type.
#
# The boot step runs as a matrix of two kernel variants, both paired with the
# same v2.1.0 ramdisk:
#   - "stock": the "kernel" file bundled inside the very same
#     testkernelramdisk.zip release asset as the ramdisk. This is a stock,
#     unpatched Android GKI kernel (no SukiSU/SUSFS/shadow_ctr patches at
#     all), used as a baseline sanity check of the QEMU boot environment
#     itself, independent of any kernel-side patches.
#   - "current": the kernel extracted from the android14-6.1.124-2025-02
#     boot.img published at the v2.2.0 release, i.e. the current
#     SukiSU/SUSFS-patched GKI kernel build that the shadow_ctr modules are
#     actually built and meant to be insmod'd against.
#
# The modules are built inside SukiSU-Ultra's prebuilt "DDK" (Driver
# Development Kit) container image (ghcr.io/ylarod/ddk-min:<kmi>-<release>,
# see https://github.com/SukiSU-Ultra/SukiSU-Ultra/blob/main/.github/workflows/ddk-lkm.yml),
# which ships a genuine vmlinux + Module.symvers + matching clang toolchain
# for this KMI, instead of a bare `git clone kernel/common` +
# `gki_defconfig` + `modules_prepare` tree (which only has stub/empty symbol
# CRC data). Building against the bare tree produces a .ko that reliably
# panics in mod_sysfs_setup() during insmod on this SukiSU/SUSFS-patched
# production kernel -- regardless of how closely the kernel sub-version is
# matched -- because `struct module`'s CRC/CFI-relevant metadata doesn't
# match a real build. Using the DDK sysroot's real vmlinux/Module.symvers
# fixes this; this was confirmed by local QEMU boot testing.
#
# shadow_ctr_checker is a plain userspace diagnostic *binary*, not a kernel
# module: it is cross-compiled separately (static, standard aarch64 gcc
# toolchain, no DDK/kernel headers involved) and simply executed by the test
# init script after the modules are insmod'd, instead of being insmod'd or
# `cat`'d from a /dev node itself.
#
# shadow_ctr.ko contains the shared shadow_hijack hook engine plus the
# namespace, SysV IPC, POSIX mqueue and cgroup-device compatibility
# subsystems. shadow_ctr_checker runs last purely so it can observe the fully
# loaded merged module (not a hard requirement).

name: Test shadow_ctr module (QEMU)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'shadow_ctr/**'
      - '.github/workflows/test-shadow-ctr-qemu.yml'
  pull_request:
    paths:
      - 'shadow_ctr/**'
      - '.github/workflows/test-shadow-ctr-qemu.yml'
  workflow_dispatch:

env:
  DDK_KMI: android14-6.1
  DDK_RELEASE: '20260313'
  TEST_RAMDISK_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.1.0/testkernelramdisk.zip
  TEST_KERNEL_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.2.0/android14-6.1.124-2025-02-boot.img

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- 1. Build shadow_ctr.ko for android14-6.1 arm64 ---
      #
      # Built inside the DDK container so the resulting .ko links against
      # a real vmlinux/Module.symvers instead of a bare gki_defconfig tree.

      - name: Pull DDK build image (${{ env.DDK_KMI }}-${{ env.DDK_RELEASE }})
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${DDK_KMI}-${DDK_RELEASE}"

      - name: Build shadow_ctr.ko (arm64, via DDK container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e KMI="${DDK_KMI}" \
            "ghcr.io/ylarod/ddk-min:${DDK_KMI}-${DDK_RELEASE}" \
            bash -euxo pipefail -c '
              KDIR="/opt/ddk/kdir/${KMI}"
              ROOT="/workspace/shadow_ctr/shadow_ctr"

              make -C "$KDIR" M="$ROOT" modules -j"$(nproc)"

              # collect all built .ko into one staging dir for injection/upload
              mkdir -p /workspace/modules-out
              cp "$ROOT/shadow_ctr.ko" /workspace/modules-out/
              echo "=== staged modules ==="
              ls -la /workspace/modules-out
            '
          # The DDK container runs as root, so modules-out/ (created inside
          # the container via the bind mount) is root-owned on the host;
          # fix ownership so the "runner" user can write into it before the
          # next (non-container) step adds the userspace checker binary.
          sudo chown -R "$(id -u):$(id -g)" modules-out

      # shadow_ctr_checker is a plain userspace binary (not a kernel module):
      # cross-compile it separately with a standard aarch64 gcc toolchain, no
      # DDK image / kernel headers needed.
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build shadow_ctr_checker (arm64, static)
        run: |
          make -C shadow_ctr/shadow_ctr_checker \
            CC=aarch64-linux-gnu-gcc
          cp shadow_ctr/shadow_ctr_checker/shadow_ctr_checker modules-out/
          file modules-out/shadow_ctr_checker
          ls -la modules-out

      - name: Upload built module (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-modules-${{ env.DDK_KMI }}-arm64
          path: modules-out/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel_variant: [stock, current]
    steps:
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio qemu-system-arm

      - name: Download built modules (arm64)
        uses: actions/download-artifact@v7
        with:
          name: shadow_ctr-modules-${{ env.DDK_KMI }}-arm64
          path: modules-out/

      - name: Mark checker binary executable
        run: chmod +x modules-out/shadow_ctr_checker

      # --- 2. Fetch the test ramdisk and the kernel image under test ---
      #
      # The ramdisk always comes from the v2.1.0 testkernelramdisk.zip. The
      # kernel booted alongside it depends on kernel_variant:
      #   - "stock": use the "kernel" file bundled in that same zip verbatim
      #     (a stock, unpatched Android GKI kernel).
      #   - "current": extract the kernel from the current
      #     SukiSU/SUSFS-patched android14-6.1.124-2025-02 boot.img (v2.2.0
      #     release), i.e. the kernel the shadow_ctr modules are actually
      #     built against.

      - name: Download test ramdisk + kernel zip (v2.1.0)
        run: |
          curl -fL -o testkernelramdisk.zip "$TEST_RAMDISK_URL"
          mkdir -p test-image
          unzip -o testkernelramdisk.zip -d test-image
          ls -la test-image

      - name: Download test kernel boot image (v2.2.0)
        if: matrix.kernel_variant == 'current'
        run: |
          curl -fL -o test-kernel-boot.img "$TEST_KERNEL_URL"

      - name: Extract kernel from boot image
        if: matrix.kernel_variant == 'current'
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg \
            -b main-kernel-build-2024 mkbootimg-tools
          python3 mkbootimg-tools/unpack_bootimg.py \
            --boot_img test-kernel-boot.img --out out-bootimg --format mkbootimg
          cp out-bootimg/kernel test-image/kernel
          ls -la test-image

      # For the "stock" variant, test-image/kernel is left as-is: the
      # "kernel" file that was already unzipped from testkernelramdisk.zip.

      # --- 3. Inject the freshly built modules into the ramdisk ---

      - name: Inject shadow_ctr module into ramdisk
        run: |
          set -e
          workdir="$GITHUB_WORKSPACE/ramdisk-root"
          mkdir -p "$workdir"
          (cd "$workdir" && cpio -idm < "$GITHUB_WORKSPACE/test-image/ramdisk.cpio")

          # Drop the freshly built merged .ko at the ramdisk root, plus the
          # standalone shadow_ctr_checker userspace binary.
          mkdir -p "$workdir/modules"
          cp "$GITHUB_WORKSPACE/modules-out/shadow_ctr.ko" "$workdir/modules/"
          cp "$GITHUB_WORKSPACE/modules-out/shadow_ctr_checker" "$workdir/"
          chmod 755 "$workdir/shadow_ctr_checker"
          ls -la "$workdir/modules" "$workdir/shadow_ctr_checker"

          # Minimal PID-1 test script, executed directly via the kernel's
          # rdinit= command line option (bypassing the image's real Android
          # init, which expects a full device environment). It mounts the
          # pseudo-filesystems bionic needs, inserts the merged module, and
          # dumps the resulting kernel log + status. All utilities
          # are invoked with absolute paths: bionic's dynamic linker requires
          # /proc/self/exe (or a resolvable argv[0]) to load shared objects,
          # which only holds once /proc is mounted and the path is absolute.
          cat > "$workdir/test_init.sh" <<'EOF'
          #!/system/bin/sh
          /system/bin/mount -t proc proc /proc
          /system/bin/mount -t sysfs sysfs /sys
          /system/bin/mount -t devtmpfs devtmpfs /dev
          M=/modules
          echo "=== SHADOW_CTR_QEMU_TEST: inserting merged module ==="
          /system/bin/insmod $M/shadow_ctr.ko
          echo "insmod shadow_ctr.ko -> $?"

          echo "=== SHADOW_CTR_QEMU_TEST: dmesg ==="
          /system/bin/dmesg
          # checker runs last, as a plain userspace binary (statically
          # linked, no dependency on this ramdisk's libc), so it observes
          # everything already loaded.
          echo "=== SHADOW_CTR_QEMU_TEST: shadow_ctr_checker ==="
          /shadow_ctr_checker
          echo "shadow_ctr_checker -> $?"
          echo "=== SHADOW_CTR_QEMU_TEST: DONE ==="
          echo o > /proc/sysrq-trigger
          while true; do :; done
          EOF
          chmod 755 "$workdir/test_init.sh"

          (cd "$workdir" && find . | cpio -o -H newc > "$GITHUB_WORKSPACE/test-image/ramdisk-test.cpio")
          ls -la "$GITHUB_WORKSPACE/test-image/ramdisk-test.cpio"

      # --- 4. Boot under QEMU and collect the serial log ---

      - name: Boot test kernel (${{ matrix.kernel_variant }}) + ramdisk under QEMU
        run: |
          set +e
          timeout --signal=KILL 120 \
            qemu-system-aarch64 \
              -M virt -cpu max -m 2G -smp 2 -nographic -no-reboot \
              -kernel test-image/kernel \
              -initrd test-image/ramdisk-test.cpio \
              -append "console=ttyAMA0 rdinit=/test_init.sh earlycon panic=-1" \
            > qemu-console.log 2>&1
          echo "QEMU exited with status $?"
          tail -n 200 qemu-console.log

      - name: Assemble QEMU test artifact bundle
        if: always()
        run: |
          mkdir -p qemu-test-bundle
          cp test-image/kernel qemu-test-bundle/tested-kernel 2>/dev/null || true
          cp test-image/ramdisk-test.cpio qemu-test-bundle/injected-ramdisk.cpio 2>/dev/null || true
          cp qemu-console.log qemu-test-bundle/qemu-console.log 2>/dev/null || true
          ls -la qemu-test-bundle

      - name: Upload tested kernel, injected ramdisk and QEMU log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-qemu-test-bundle-${{ matrix.kernel_variant }}
          path: qemu-test-bundle/
