# Boot-test the shadow_ctr module family under QEMU.
#
# shadow_ctr used to be a single combined shadow_ctr.ko; it is now split into
# several independently loadable modules under shadow_ctr/ (see
# shadow_ctr/README.md). This workflow builds ALL of the android14-6.1 arm64
# modules, injects the freshly built .ko files into a prebuilt test kernel +
# ramdisk image, boots it under qemu-system-aarch64, insmods them in
# dependency order, and collects the serial console log (including the insmod
# attempts, resulting kernel messages, the presence of each /dev node, and the
# contents of /dev/shadow_ctr_checker) as a build artifact for inspection.
#
# The test ramdisk is a standalone (system-as-root) recovery image published
# at the v2.1.0 release specifically for this kind of smoke test; it ships
# busybox/toybox utilities and does not require any additional block
# devices, so it can boot directly from an initramfs under QEMU's "virt"
# machine type. The kernel image booted alongside it is extracted from the
# android14-6.1.124-2025-02 boot.img published at the v2.2.0 release, so the
# modules are tested against an actual SukiSU/SUSFS-patched GKI kernel build.
#
# The modules are built inside SukiSU-Ultra's prebuilt "DDK" (Driver
# Development Kit) container image (ghcr.io/ylarod/ddk-min:<kmi>-<release>,
# see https://github.com/SukiSU-Ultra/SukiSU-Ultra/blob/main/.github/workflows/ddk-lkm.yml),
# which ships a genuine vmlinux + Module.symvers + matching clang toolchain
# for this KMI, instead of a bare `git clone kernel/common` +
# `gki_defconfig` + `modules_prepare` tree (which only has stub/empty symbol
# CRC data). Building against the bare tree produces a .ko that reliably
# panics in mod_sysfs_setup() during insmod on this SukiSU/SUSFS-patched
# production kernel -- regardless of how closely the kernel sub-version is
# matched -- because `struct module`'s CRC/CFI-relevant metadata doesn't
# match a real build. Using the DDK sysroot's real vmlinux/Module.symvers
# fixes this; this was confirmed by local QEMU boot testing.
#
# Dependency note: shadow_hijack.ko hosts the shared shadow_hook_install()/
# remove() implementation that shadow_ns_base, shadow_ns_uts, shadow_sysvipc,
# shadow_mqueue and shadow_cgdevices all resolve at modpost time via
# KBUILD_EXTRA_SYMBOLS, so it is built (and insmod'd) first. The shadow_ns_*
# per-type modules additionally resolve shadow_ns_base's EXPORT_SYMBOL_GPL
# symbols, so shadow_ns_base is built (with KBUILD_EXTRA_SYMBOLS wiring for
# the dependents) and insmod'd right after. shadow_ctr_checker has no
# build-time dependency on anything (it detects the other modules at runtime
# via symbol_get), and is loaded last so it observes all of them.

name: Test shadow_ctr modules (QEMU)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'shadow_ctr/**'
      - '.github/workflows/test-shadow-ctr-qemu.yml'
  pull_request:
    paths:
      - 'shadow_ctr/**'
      - '.github/workflows/test-shadow-ctr-qemu.yml'
  workflow_dispatch:

env:
  DDK_KMI: android14-6.1
  DDK_RELEASE: '20260313'
  TEST_RAMDISK_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.1.0/testkernelramdisk.zip
  TEST_KERNEL_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.2.0/android14-6.1.124-2025-02-boot.img

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio qemu-system-arm

      # --- 1. Build all shadow_ctr modules for android14-6.1 arm64 ---
      #
      # Built inside the DDK container so the resulting .ko files link against
      # a real vmlinux/Module.symvers instead of a bare gki_defconfig tree.

      - name: Pull DDK build image (${{ env.DDK_KMI }}-${{ env.DDK_RELEASE }})
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${DDK_KMI}-${DDK_RELEASE}"

      - name: Build all shadow_ctr modules (arm64, via DDK container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e KMI="${DDK_KMI}" \
            "ghcr.io/ylarod/ddk-min:${DDK_KMI}-${DDK_RELEASE}" \
            bash -euxo pipefail -c '
              KDIR="/opt/ddk/kdir/${KMI}"
              ROOT="/workspace/shadow_ctr"
              J="$(nproc)"

              build() { local dir="$1"; shift; make -C "$KDIR" M="$ROOT/$dir" modules -j"$J" "$@"; }

              # shadow_hijack first (produces Module.symvers every hooking
              # module resolves via KBUILD_EXTRA_SYMBOLS)
              build shadow_hijack
              HIJACK_SYMS="$ROOT/shadow_hijack/Module.symvers"

              # base next (produces Module.symvers for the ns_* dependents)
              build shadow_ns_base KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"
              BASE_SYMS="$ROOT/shadow_ns_base/Module.symvers"
              build shadow_ns_uts KBUILD_EXTRA_SYMBOLS="$BASE_SYMS $HIJACK_SYMS"
              for t in net ipc pid mnt user cgroup; do
                build "shadow_ns_$t" KBUILD_EXTRA_SYMBOLS="$BASE_SYMS"
              done
              build shadow_sysvipc KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"
              build shadow_mqueue KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"
              build shadow_cgdevices KBUILD_EXTRA_SYMBOLS="$HIJACK_SYMS"
              build shadow_ctr_checker
              # overlay2 is android14-6.1 compatible (this KMI), so build it too
              build shadow_overlay2

              # collect all built .ko into one staging dir for injection/upload
              mkdir -p /workspace/modules-out
              find "$ROOT" -name "*.ko" -exec cp {} /workspace/modules-out/ \;
              echo "=== staged modules ==="
              ls -la /workspace/modules-out
            '
          ls -la modules-out

      - name: Upload built modules (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-modules-${{ env.DDK_KMI }}-arm64
          path: modules-out/

      # --- 2. Fetch the test ramdisk and the kernel image under test ---

      - name: Download test ramdisk
        run: |
          curl -fL -o testkernelramdisk.zip "$TEST_RAMDISK_URL"
          mkdir -p test-image
          unzip -o testkernelramdisk.zip -d test-image
          ls -la test-image

      - name: Download test kernel boot image (v2.2.0)
        run: |
          curl -fL -o test-kernel-boot.img "$TEST_KERNEL_URL"

      - name: Extract kernel from boot image
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg \
            -b main-kernel-build-2024 mkbootimg-tools
          python3 mkbootimg-tools/unpack_bootimg.py \
            --boot_img test-kernel-boot.img --out out-bootimg --format mkbootimg
          cp out-bootimg/kernel test-image/kernel
          ls -la test-image

      # --- 3. Inject the freshly built modules into the ramdisk ---

      - name: Inject shadow_ctr modules into ramdisk
        run: |
          set -e
          workdir="$GITHUB_WORKSPACE/ramdisk-root"
          mkdir -p "$workdir"
          (cd "$workdir" && cpio -idm < "$GITHUB_WORKSPACE/test-image/ramdisk.cpio")

          # Drop every freshly built .ko at the ramdisk root.
          mkdir -p "$workdir/modules"
          cp "$GITHUB_WORKSPACE"/modules-out/*.ko "$workdir/modules/"
          ls -la "$workdir/modules"

          # Minimal PID-1 test script, executed directly via the kernel's
          # rdinit= command line option (bypassing the image's real Android
          # init, which expects a full device environment). It mounts the
          # pseudo-filesystems bionic needs, inserts the modules in dependency
          # order, and dumps the resulting kernel log + status. All utilities
          # are invoked with absolute paths: bionic's dynamic linker requires
          # /proc/self/exe (or a resolvable argv[0]) to load shared objects,
          # which only holds once /proc is mounted and the path is absolute.
          cat > "$workdir/test_init.sh" <<'EOF'
          #!/system/bin/sh
          /system/bin/mount -t proc proc /proc
          /system/bin/mount -t sysfs sysfs /sys
          /system/bin/mount -t devtmpfs devtmpfs /dev
          M=/modules
          echo "=== SHADOW_CTR_QEMU_TEST: inserting modules (dependency order) ==="
          # shadow_hijack MUST go first (every hooking module depends on it).
          /system/bin/insmod $M/shadow_hijack.ko
          echo "insmod shadow_hijack.ko -> $?"
          # shadow_ns_base MUST go next (the ns_* modules depend on it).
          /system/bin/insmod $M/shadow_ns_base.ko
          echo "insmod shadow_ns_base.ko -> $?"
          for m in shadow_ns_uts shadow_ns_net shadow_ns_ipc shadow_ns_pid \
                   shadow_ns_mnt shadow_ns_user shadow_ns_cgroup \
                   shadow_sysvipc shadow_mqueue shadow_cgdevices \
                   shadow_overlay2; do
            if [ -f "$M/$m.ko" ]; then
              /system/bin/insmod "$M/$m.ko"
              echo "insmod $m.ko -> $?"
            fi
          done
          # checker last so it observes everything already loaded.
          /system/bin/insmod $M/shadow_ctr_checker.ko
          echo "insmod shadow_ctr_checker.ko -> $?"

          echo "=== SHADOW_CTR_QEMU_TEST: dmesg ==="
          /system/bin/dmesg
          echo "=== SHADOW_CTR_QEMU_TEST: /dev nodes ==="
          /system/bin/ls -la /dev/shadow_ns /dev/shadow_sysvipc \
            /dev/shadow_mqueue /dev/shadow_cgdevices /dev/shadow_ctr_checker
          echo "=== SHADOW_CTR_QEMU_TEST: overlay registered? ==="
          /system/bin/grep overlay /proc/filesystems
          echo "=== SHADOW_CTR_QEMU_TEST: cat /dev/shadow_ctr_checker ==="
          /system/bin/cat /dev/shadow_ctr_checker
          echo "=== SHADOW_CTR_QEMU_TEST: DONE ==="
          echo o > /proc/sysrq-trigger
          while true; do :; done
          EOF
          chmod 755 "$workdir/test_init.sh"

          (cd "$workdir" && find . | cpio -o -H newc > "$GITHUB_WORKSPACE/test-image/ramdisk-test.cpio")
          ls -la "$GITHUB_WORKSPACE/test-image/ramdisk-test.cpio"

      # --- 4. Boot under QEMU and collect the serial log ---

      - name: Boot test kernel + ramdisk under QEMU
        run: |
          set +e
          timeout --signal=KILL 120 \
            qemu-system-aarch64 \
              -M virt -cpu max -m 2G -smp 2 -nographic -no-reboot \
              -kernel test-image/kernel \
              -initrd test-image/ramdisk-test.cpio \
              -append "console=ttyAMA0 rdinit=/test_init.sh earlycon panic=-1" \
            > qemu-console.log 2>&1
          echo "QEMU exited with status $?"
          tail -n 200 qemu-console.log

      - name: Assemble QEMU test artifact bundle
        if: always()
        run: |
          mkdir -p qemu-test-bundle
          cp test-image/kernel qemu-test-bundle/tested-kernel 2>/dev/null || true
          cp test-image/ramdisk-test.cpio qemu-test-bundle/injected-ramdisk.cpio 2>/dev/null || true
          cp qemu-console.log qemu-test-bundle/qemu-console.log 2>/dev/null || true
          ls -la qemu-test-bundle

      - name: Upload tested kernel, injected ramdisk and QEMU log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow_ctr-qemu-test-bundle
          path: qemu-test-bundle/
