# Build for the overlay.ko out-of-tree module (ctr_patches/shadow_overlay).
#
# This vendors the real fs/overlayfs sources from the android14-6.1 branch
# (see ctr_patches/shadow_overlay/README.md), so — unlike
# build-shadow-ctr.yml's matrix — it is only built against that one KMI: the
# overlayfs internal VFS ABI it depends on (vfs_tmpfile_open, lookup_one,
# mnt_idmap vs user_namespace parameters, etc.) is not source-compatible
# across the other kernel/common branches this repository targets.
#
# Like build-shadow-ctr.yml, this builds inside SukiSU-Ultra's prebuilt "DDK"
# container image (ghcr.io/ylarod/ddk-min:<kmi>-<release>), which ships a
# genuine vmlinux + Module.symvers + matching clang toolchain for the KMI,
# instead of a bare `git clone kernel/common` + `gki_defconfig` +
# `modules_prepare` tree (which only has stub/empty symbol CRC data).
#
# Credit: SukiSU-Ultra (https://github.com/SukiSU-Ultra/SukiSU-Ultra).

name: Build shadow_overlay (overlay.ko)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'ctr_patches/shadow_overlay/**'
      - '.github/workflows/build-shadow-overlay.yml'
  pull_request:
    paths:
      - 'ctr_patches/shadow_overlay/**'
      - '.github/workflows/build-shadow-overlay.yml'
  workflow_dispatch:

env:
  KMI: android14-6.1
  # Kept in sync with build-shadow-ctr.yml / test-shadow-ctr-qemu.yml.
  DDK_RELEASE: '20260313'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull DDK build image (${{ env.KMI }}-${{ env.DDK_RELEASE }})
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${{ env.KMI }}-${{ env.DDK_RELEASE }}"

      - name: Build overlay.ko (arm64, via DDK container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            "ghcr.io/ylarod/ddk-min:${{ env.KMI }}-${{ env.DDK_RELEASE }}" \
            bash -c "make -C /opt/ddk/kdir/${{ env.KMI }} M=/workspace/ctr_patches/shadow_overlay ARCH=arm64 modules -j\$(nproc)"
          ls -la ctr_patches/shadow_overlay/overlay.ko

      - name: Upload overlay.ko (${{ env.KMI }})
        uses: actions/upload-artifact@v7
        with:
          name: shadow_overlay-${{ env.KMI }}-arm64
          path: ctr_patches/shadow_overlay/overlay.ko
